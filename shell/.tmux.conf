# --- Sensible defaults ---
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#I: #W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Moshi integration ---
# Propagate the MOSHI_CLIENT signal into new tmux sessions attached by this shell.
set-option -ga update-environment " MOSHI_CLIENT"

# When attached from the Moshi iOS client, clear the status regions so the
# swipe-to-change-window gesture (which reads the status bar) stays reliable.
if-shell '[ -n "$MOSHI_CLIENT" ]' {
  set -g status-left ''
  set -g status-right ''
}
